version: '3'

services:
  projects:
    image: lasuite/projects:latest
    restart: on-failure
    volumes:
      - user-avatars:/app/public/user-avatars
      - project-background-images:/app/public/project-background-images
      - attachments:/app/private/attachments
    ports:
      - 3000:1337
    environment:
      ## Required
      - BASE_URL=http://yourdomain.com
      - DATABASE_URL=postgresql://postgres@postgres/projects
      - SECRET_KEY=generate-key

      # OpenID Connect (OIDC), required per the README (any SSO-capable provider,
      # e.g. Keycloak or Ory Hydra). OIDC_ISSUER/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET
      # must be filled in below: leaving them blank while OIDC_ENFORCED=true (the
      # default here) breaks login entirely, it won't fall back to local accounts.
      # To use local email/password login instead, set OIDC_ENFORCED=false and
      # remove/ignore the OIDC_* lines.
      - OIDC_ISSUER=
      - OIDC_CLIENT_ID=
      - OIDC_CLIENT_SECRET=

      ## Active by default
      - ALLOW_ALL_TO_CREATE_PROJECTS=true

      # Recommended OIDC defaults for a generic provider, adjust to match yours
      - OIDC_SCOPES=openid email profile
      - OIDC_USE_DEFAULT_RESPONSE_MODE=true
      - OIDC_FULLNAME_ATTRIBUTES=name
      - OIDC_IGNORE_USERNAME=true
      - OIDC_IGNORE_ROLES=true
      - OIDC_ENFORCED=true

      ## Opt-in, by feature

      ### OpenID Connect (advanced)
      # - OIDC_ID_TOKEN_SIGNED_RESPONSE_ALG=
      # - OIDC_USERINFO_SIGNED_RESPONSE_ALG=
      # - OIDC_RESPONSE_MODE=fragment
      # - OIDC_ADMIN_ROLES=admin
      # - OIDC_CLAIMS_SOURCE=userinfo
      # - OIDC_EMAIL_ATTRIBUTE=email
      # - OIDC_USERNAME_ATTRIBUTE=preferred_username
      # - OIDC_ROLES_ATTRIBUTE=groups
      # - OIDC_POST_LOGOUT_REDIRECT_URI=http://localhost:3000/custom-logout-page

      # Enables "org mode": users are auto-assigned as manager of the project
      # matching the value of this OIDC claim. Leave unset for free mode.
      # - ORGANIZATION_ID_CLAIM=

      ### Horizontal scaling (multiple instances)
      # This file defines a SINGLE instance: the app listens on container port
      # 1337, published here as host port 3000. To scale out, run several
      # `projects` instances behind a load balancer. On this Compose network the
      # balancer forwards to `projects:1337`; from outside Docker it targets each
      # instance's published host port instead. `docker compose --scale` won't
      # work as-is because replicas would all reuse the fixed 3000:1337 mapping —
      # give each its own host port, or drop the mapping and route via the
      # Compose network. Every replica must share this Redis, the same
      # DATABASE_URL, and the same SECRET_KEY (used to sign session cookies),
      # plus S3 so uploads are shared.
      # Uncomment the `redis` service (and its depends_on) below as well.
      # - REDIS_URL=redis://redis:6379/0

      ### Object storage (S3)
      # - S3_ENDPOINT=
      # - S3_REGION=
      # - S3_ACCESS_KEY_ID=
      # - S3_SECRET_ACCESS_KEY=
      # - S3_BUCKET=
      # - S3_FORCE_PATH_STYLE=true

      ### Email notifications (https://nodemailer.com/smtp/)
      # - SMTP_HOST=
      # - SMTP_PORT=587
      # - SMTP_NAME=
      # - SMTP_SECURE=true
      # - SMTP_USER=
      # - SMTP_PASSWORD=
      # - SMTP_FROM="Demo Demo" <demo@demo.demo>
      # - SMTP_TLS_REJECT_UNAUTHORIZED=false

      ### Default admin user (seeded on first init)
      # - DEFAULT_ADMIN_EMAIL=demo@demo.demo # Do not remove if you want to prevent this user from being edited/deleted
      # - DEFAULT_ADMIN_PASSWORD=demo
      # - DEFAULT_ADMIN_NAME=Demo Demo
      # - DEFAULT_ADMIN_USERNAME=demo

      ### Outgoing webhooks
      # Optional fields: accessToken, events, excludedEvents
      # - |
      #   WEBHOOKS=[{
      #     "url": "http://localhost:3001",
      #     "accessToken": "notaccesstoken",
      #     "events": ["cardCreate", "cardUpdate", "cardDelete"],
      #     "excludedEvents": ["notificationCreate", "notificationUpdate"]
      #   }]

      ### Advanced / rarely needed
      # - THEME_PREFIX=dsfr # To use a specific Cunningham theme base
      # - SERVICE_NAME=Projets # Browser tab title, meta description and email wording
      # - SHOW_DETAILED_AUTH_ERRORS=false # Set to true to show more detailed authentication error messages. It should not be enabled without a rate limiter for security reasons.
      # - TRUST_PROXY=0
      # - TOKEN_EXPIRES_IN=365 # In days
      # - API_TOKEN_RATE_LIMIT_READ=300 # Requests per minute per API token
      # - API_TOKEN_RATE_LIMIT_WRITE=60 # Requests per minute per API token

      # related: https://github.com/knex/knex/issues/2354
      # As knex does not pass query parameters from the connection string we
      # have to use environment variables in order to pass the desired values, e.g.
      # - PGSSLMODE=<value>

      # Configure knex to accept SSL certificates
      # - KNEX_REJECT_UNAUTHORIZED_SSL_CERTIFICATE=false
    depends_on:
      postgres:
        condition: service_healthy
      # Uncomment together with the `redis` service below when scaling horizontally,
      # so startup waits for Redis to be ready.
      # redis:
      #   condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=projects
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d projects']
      interval: 10s
      timeout: 5s
      retries: 5

  # Only needed for horizontal scaling (see REDIS_URL above). Uncomment to run
  # several `projects` instances that share sessions and realtime broadcasts.
  # redis:
  #   image: redis:7-alpine
  #   restart: on-failure
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  user-avatars:
  project-background-images:
  attachments:
  db-data:
